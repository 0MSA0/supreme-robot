[project]
name = "supreme-robot"
version = "0.1.0"
description = "A GPT like LLM from scratch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch>=2.11.0,<2.12.0",
    "wandb>=0.31.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.scripts]
supreme-robot = "supreme_robot_torch:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
