[project]
name = "supreme-robot"
version = "0.1.0"
description = "A GPT like LLM from scratch"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]

[project.scripts]
supreme-robot = "supreme_robot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
